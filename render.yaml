services:
  - type: web
    name: marketlens
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn market_prices.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,marketlens.com
      - key: DATABASE_URL
        fromDatabase:
          name: marketlens-db
          property: connectionString
      - key: DJANGO_EMAIL_HOST_USER
        sync: false
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: marketlens-db
    plan: free
    databaseName: marketlens
    user: marketlens